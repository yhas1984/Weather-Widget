<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#skyGradient)" />
  
  <!-- Sun -->
  <circle cx="70" cy="70" r="30" fill="url(#sunGradient)" />
  
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="25" x2="70" y2="15" />
    <line x1="70" y1="115" x2="70" y2="125" />
    <line x1="25" y1="70" x2="15" y2="70" />
    <line x1="115" y1="70" x2="125" y2="70" />
    <line x1="40" y1="40" x2="33" y2="33" />
    <line x1="100" y1="40" x2="107" y2="33" />
    <line x1="40" y1="100" x2="33" y2="107" />
    <line x1="100" y1="100" x2="107" y2="107" />
  </g>
  
  <!-- Cloud -->
  <g transform="translate(110, 80)">
    <ellipse cx="0" cy="0" rx="35" ry="20" fill="url(#cloudGradient)" />
    <ellipse cx="-20" cy="5" rx="25" ry="18" fill="url(#cloudGradient)" />
    <ellipse cx="20" cy="5" rx="25" ry="18" fill="url(#cloudGradient)" />
  </g>
  
  <!-- Rain drops -->
  <g fill="#4A90D9" opacity="0.8">
    <ellipse cx="105" cy="115" rx="3" ry="6" />
    <ellipse cx="120" cy="120" rx="3" ry="6" />
    <ellipse cx="135" cy="115" rx="3" ry="6" />
    <ellipse cx="112" cy="130" rx="3" ry="6" />
    <ellipse cx="127" cy="135" rx="3" ry="6" />
  </g>
</svg>